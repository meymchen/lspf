[package]
name = "lspf-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lspf = { path = "../crates/lspf", default-features = false, features = ["fuzzing"] }

[workspace]
members = ["."]

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content-length"
path = "fuzz_targets/content-length.rs"
test = false
doc = false
bench = false

[[bin]]
name = "uri-identity"
path = "fuzz_targets/uri-identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "position-conversion"
path = "fuzz_targets/position-conversion.rs"
test = false
doc = false
bench = false

[[bin]]
name = "incremental-edits"
path = "fuzz_targets/incremental-edits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "notebook-cell-sync"
path = "fuzz_targets/notebook-cell-sync.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lifecycle-sequences"
path = "fuzz_targets/lifecycle-sequences.rs"
test = false
doc = false
bench = false
