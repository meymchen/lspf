name: Fuzz and Gate D verification

on:
  schedule:
    # 06:00 Wednesday and Saturday Singapore time. GitHub cron has no timezone
    # field and is always UTC, so SGT (UTC+8, no DST) lands these on Tuesday and
    # Friday at 22:00: the day-of-week field reading `2,5` is deliberate, not an
    # off-by-one.
    #
    # Two fixed weekdays approximate "every three days" without the wart that
    # `*/3` in the day-of-month field carries, where the 31st is followed by the
    # 1st a single day later. The gap here alternates 3 and 4 days and is
    # identical every week.
    #
    # The cadence is a bisection-window knob. It was daily before #272, at
    # roughly 4.7 pushes a day, so a reported crash was attributable to ~5
    # commits; here it is ~14-19. Bisecting is `cargo +nightly fuzz run <target>
    # <reproducer>` against candidate revisions and the retained reproducer
    # makes that mechanical, so what widens is the operator's time to attribute
    # a crash, not the ability to.
    - cron: "0 22 * * 2,5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The target list lives in `ci/run-fuzz.sh`, where `--check` already holds it
  # against the manifest, the seeds and the documented budgets. Reading it here
  # keeps the matrix from becoming a second, silently stale copy.
  fuzz-matrix:
    name: load fuzz target matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: matrix
        run: printf 'matrix=%s\n' "$(bash ci/run-fuzz.sh --matrix)" >>"$GITHUB_OUTPUT"

  # Each target holds a fixed wall-clock budget, so running them in sequence
  # made the sweep cost the sum of those budgets. They share nothing, and a
  # target that has a whole runner to itself also fuzzes faster than one of
  # seven sharing four cores.
  fuzz-target:
    name: fuzz ${{ matrix.target }}
    needs: fuzz-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fuzz-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          cache: "false"
      - name: Install the fuzz runner
        run: cargo install cargo-fuzz --locked
      - name: Fuzz one target
        env:
          TARGET: ${{ matrix.target }}
        run: bash ci/run-fuzz.sh --target "$TARGET" "$RUNNER_TEMP/fuzz-result"
      - name: Retain the target result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-target-${{ matrix.target }}
          path: ${{ runner.temp }}/fuzz-result
          if-no-files-found: error
          retention-days: 90

  gate-d-evidence:
    name: Gate D verification evidence
    needs:
      - fuzz-matrix
      - fuzz-target
    # A failing target still has to reach the evidence artifact and the issue
    # this workflow files, so this runs on anything short of cancellation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The remaining components run on the toolchain `rust-toolchain.toml`
      # pins, which is what they always ran on: only the fuzz sweep needed
      # nightly, and it no longer runs in this job.
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Download the fuzz target results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ needs.fuzz-matrix.outputs.matrix }}
        # A leg that never produced a result is a Gate D failure that belongs in
        # the evidence, so a missing artifact must not take this job down before
        # it can record one.
        run: |
          results="$RUNNER_TEMP/fuzz-results"
          mkdir -p "$results"
          for target in $(jq -r '.target[]' <<<"$MATRIX"); do
            gh run download "$GITHUB_RUN_ID" \
              --name "fuzz-target-$target" --dir "$results/$target" \
              || echo "no result artifact for fuzz target $target" >&2
          done
      - name: Run revision-locked Gate D verification
        env:
          GATE_D_FUZZ_RESULTS: ${{ runner.temp }}/fuzz-results
        run: >-
          bash ci/run-gate-d-evidence.sh
          "$GITHUB_SHA"
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          "$RUNNER_TEMP/gate-d-evidence"
      - name: Retain Gate D verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gate-d-verification-evidence
          path: ${{ runner.temp }}/gate-d-evidence
          if-no-files-found: error
          retention-days: 90
      # One open issue at a time: a passing run does not prove that the crash a
      # previous run reported was fixed, so nothing here closes the issue.
      - name: Report the failure once
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Both `gh issue list --label` and `gh issue create --label` fail on a
          # label that does not exist, so provision it here rather than relying
          # on undocumented repository setup. Creating it twice is not an error.
          gh label create gate-d-failure \
            --description "Scheduled Gate D verification is failing" \
            --color B60205 2>/dev/null || true
          if [ -n "$(gh issue list --label gate-d-failure --state open --limit 1 --json number --jq '.[].number')" ]; then
            echo 'An open gate-d-failure issue already tracks this; not filing another.'
            exit 0
          fi
          gh issue create \
            --title "Gate D verification failed on $GITHUB_SHA" \
            --label gate-d-failure \
            --body "$(printf '%s\n' \
              "Gate D verification failed for [\`$GITHUB_SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)." \
              "" \
              "Run: $RUN_URL" \
              "" \
              "The retained \`gate-d-verification-evidence\` artifact holds the component logs and any minimized fuzz reproducers." \
              "" \
              "This issue stays open until someone confirms the underlying defect is fixed; later runs will not file duplicates while it is open.")"
