name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  protocol-boundaries:
    name: all bounded fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          cache: "false"
      - run: cargo install cargo-fuzz --locked
      - name: Run every fuzz target
        run: bash ci/run-fuzz.sh --all
      - name: Retain minimized reproducible inputs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fuzz-reproducers
          path: fuzz/artifacts
          if-no-files-found: error
          retention-days: 90
