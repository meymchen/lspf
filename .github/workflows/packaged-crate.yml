name: Packaged crate

on:
  workflow_call:

permissions: {}

jobs:
  packaged-crate:
    name: packaged crate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - run: bash ci/test-package-file-policy.sh
      - run: bash ci/check-packaged-crate.sh
