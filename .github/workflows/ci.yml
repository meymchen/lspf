name: CI

# `pull_request` deliberately carries no path filter, and must not grow one.
# `main` requires status checks, and GitHub never creates a check run for a
# workflow that a path filter skipped: the required check stays "Expected --
# waiting for status" and blocks the pull request forever, rather than passing
# vacuously. A pull request that only edits an ADR would need an admin bypass to
# merge. Running the pull-request jobs on those changes is what the checks cost.
#
# `push` keeps the list, where nothing is blocked and avoiding even the planning
# jobs is safe: these paths cannot change what the workspace builds, tests,
# documents, packages, or releases. Other ordinary pushes run only release
# planning and the write-capable release-plz policy gate; an authorized release
# revision alone reruns the exact release gates. `SECURITY.md` is deliberately absent:
# Gate A cites it as the implementation of the support-matrix and
# compatibility-policy claims. `README.md` and the English website guides are
# absent too, because they are compiled into rustdoc through
# `#[doc = include_str!]` and their examples are doctested.
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/adr/**
      - docs/agents/**
      - .vscode/**
      - .zed/**
      - CONTEXT.md
      - AGENTS.md
      - CLAUDE.md
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-context:
    name: release context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.release.outputs.authorized }}
      build-checks: ${{ steps.changes.outputs.build-checks }}
      markdown-checks: ${{ steps.changes.outputs.markdown-checks }}
      pending: ${{ steps.release.outputs.pending }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify pull request changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            bash ci/classify-ci-changes.sh "$BASE_SHA" "$HEAD_SHA"
          else
            echo 'build-checks=true' >>"$GITHUB_OUTPUT"
            echo 'markdown-checks=true' >>"$GITHUB_OUTPUT"
          fi
      - name: Detect an authorized release revision
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            bash ci/detect-release-context.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
          else
            echo 'pending=false' >>"$GITHUB_OUTPUT"
            echo 'authorized=false' >>"$GITHUB_OUTPUT"
            echo 'version=' >>"$GITHUB_OUTPUT"
          fi

  feature-matrix:
    name: load native feature matrix
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: matrix
        run: echo "value=$(bash ci/native-feature-command.sh matrix)" >> "$GITHUB_OUTPUT"

  commit-messages:
    name: commit messages
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test commit message policy
        run: bash ci/tests/unit/check-commit-messages.sh
      - name: Check pull request commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash ci/check-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"

  markdownlint:
    name: markdownlint
    if: ${{ needs.release-context.outputs.markdown-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
      # The changelog is the one markdown file markdownlint skips, because
      # release-plz writes it. Its structure is still load-bearing for a
      # release, so it is checked here rather than left unchecked.
      - name: Test changelog policy
        run: bash ci/tests/unit/check-changelog.sh
      - name: Check the changelog
        run: bash ci/check-changelog.sh

  fuzz-contract:
    name: fuzz contract
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash ci/tests/unit/run-fuzz.sh

  fmt:
    name: fmt
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - run: cargo fmt --all -- --check

  public-docs:
    name: public docs
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    needs: release-context
    uses: ./.github/workflows/public-docs.yml
    permissions:
      contents: read

  packaged-crate:
    name: packaged crate
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    needs: release-context
    uses: ./.github/workflows/packaged-crate.yml
    permissions:
      contents: read

  security:
    name: supply-chain security
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    needs: release-context
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  public-api:
    name: public API compatibility
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          tools: cargo-semver-checks@0.50.0
      - name: Test compatibility gate behavior
        run: bash ci/tests/unit/check-public-api.sh
      - name: Compare supported public API surfaces
        run: bash ci/check-public-api.sh
      - name: Upload machine-readable compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-api-compatibility-report
          path: target/public-api-compatibility/report.json
          if-no-files-found: error
          retention-days: 14

  msrv:
    name: msrv
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - release-context
      - feature-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.feature-matrix.outputs.matrix) }}
    # Keep the explicit override aligned with `rust-toolchain.toml` and the
    # workspace `rust-version`, so the MSRV matrix cannot drift independently.
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.0
      - run: cargo check -p lspf --locked ${{ matrix.cargo_args }}
        env:
          RUSTFLAGS: ${{ matrix.msrv_rustflags }}
      - if: matrix.name == 'default'
        run: cargo check --workspace --all-targets --locked

  feature-contract:
    name: feature contract
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - run: bash ci/check-feature-contract.sh

  public-interface:
    name: public interface
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Test the interface freeze gate behavior
        run: bash ci/tests/unit/check-public-interface.sh
      - name: Compare the frozen inventory with the crate
        run: bash ci/check-public-interface.sh

  native-matrix:
    name: native ${{ matrix.name }}
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - release-context
      - feature-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.feature-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - name: Clippy with warnings denied
        run: cargo clippy -p lspf --all-targets --locked ${{ matrix.cargo_args }} -- -D warnings
      - name: All-target tests
        run: cargo test -p lspf --all-targets --locked ${{ matrix.cargo_args }}

  test:
    name: test
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - run: bash ci/tests/unit/check-editor-validation.sh
      - run: bash ci/native-feature-command.sh test-workspace
      - run: bash ci/native-feature-command.sh test-workspace-docs
      # The fuzz drivers' fast regressions. `fuzzing` is deliberately outside
      # the feature matrix, so without this step these tests compile to nothing
      # and a broken driver would surface only in the twice-weekly fuzz sweep.
      - name: Fuzz driver regressions
        run: >-
          cargo test -p lspf --features fuzzing --locked
          --test notebook_cell_sync_fuzz
          --test envelope_fuzz_regressions

  native-lifecycle:
    name: native lifecycle (${{ matrix.name }})
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    needs: release-context
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS (Intel)
            os: macos-15-intel
          - name: macOS (Apple Silicon)
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - name: Exercise the packaged reference server over stdio
        run: cargo test -p lspf-markdown --test packaged_editor_journey -- --nocapture

  wasm:
    name: wasm
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          tools: wasm-bindgen-cli@0.2.127
      # The pre-0.5 compile spike (ADR 0020): the protocol kernel must compile
      # for wasm32 without enabling the Tokio runtime.
      - run: cargo check -p lspf --target wasm32-unknown-unknown --no-default-features --features wasm --locked
      - run: cargo check -p lspf --target wasm32-unknown-unknown --no-default-features --features wasm --example shared_server --locked
      - run: cargo check -p lspf --target wasm32-unknown-unknown --no-default-features --features worker-channel --locked
      - run: cargo check -p lspf --target wasm32-unknown-unknown --no-default-features --features worker-channel --example worker_channel --locked
      - run: bash ci/check-worker-channel-examples.sh
      - run: cargo clippy -p lspf --target wasm32-unknown-unknown --no-default-features --features worker-channel --all-targets --locked -- -D warnings
      - run: cargo test -p lspf --target wasm32-unknown-unknown --no-default-features --features worker-channel --all-targets --locked
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  test-coverage:
    name: test coverage
    if: ${{ needs.release-context.outputs.build-checks == 'true' && (github.event_name != 'push' || needs.release-context.outputs.authorized == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview
          tools: cargo-llvm-cov@0.9.0
      - name: Test the test-coverage gate behavior
        run: bash ci/tests/unit/check-test-coverage.sh
      - name: Exercise the whole workspace
        run: bash ci/native-feature-command.sh coverage-workspace
      - name: Generate human- and machine-readable reports
        run: |
          cargo llvm-cov report --html --output-dir target/test-coverage
          cargo llvm-cov report --lcov --output-path target/test-coverage/lcov.info
          cargo llvm-cov report --json --summary-only --output-path target/test-coverage/raw-summary.json
      - name: Execute declared failure-path evidence tests
        run: bash ci/run-coverage-evidence-tests.sh
      - name: Enforce workspace and protocol-engine baselines
        run: bash ci/check-test-coverage.sh
      - name: Upload test-coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-coverage-report
          path: |
            target/test-coverage/html
            target/test-coverage/lcov.info
            target/test-coverage/raw-summary.json
            target/test-coverage/evidence.json
            target/test-coverage/summary.json
          if-no-files-found: error
          retention-days: 14

  performance-baseline:
    name: Reproducible performance baseline
    if: ${{ github.event_name == 'push' && needs.release-context.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - name: Test performance benchmark contract
        run: bash ci/tests/system/performance-benchmark.sh
      - name: Test performance regression gate behavior
        run: bash ci/tests/unit/run-performance-baseline.sh
      - name: Run revision-locked performance baseline
        run: >-
          bash ci/run-performance-baseline.sh
          "$GITHUB_SHA"
          "$RUNNER_TEMP/performance-baseline"
      - name: Retain performance baseline
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reproducible-performance-baseline
          path: ${{ runner.temp }}/performance-baseline
          if-no-files-found: error
          retention-days: 90

  bounded-memory-soak:
    name: Bounded-memory soak journeys (${{ matrix.scenario }})
    if: ${{ github.event_name == 'push' && needs.release-context.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - request
          - cancellation
          - edit
          - notebook
          - partial-result
          - progress
          - slow-peer
          - reconnect
          - shutdown
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - name: Test soak runner contract
        run: bash ci/tests/unit/run-soak-journeys.sh
      - name: Test soak workload contract
        run: bash ci/tests/system/soak-journeys.sh
      - name: Select soak scenario
        env:
          SOAK_SCENARIO: ${{ matrix.scenario }}
        run: >-
          jq --arg scenario "$SOAK_SCENARIO"
          '.scenarios = [$scenario]'
          soak/workloads-v2.json
          > "$RUNNER_TEMP/soak-workload.json"
      - name: Run revision-locked soak journeys
        env:
          SOAK_WORKLOADS: ${{ runner.temp }}/soak-workload.json
        run: >-
          bash ci/run-soak-journeys.sh
          "$GITHUB_SHA"
          "$RUNNER_TEMP/bounded-memory-soak"
      - name: Retain bounded-memory soak artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bounded-memory-soak-${{ matrix.scenario }}
          path: ${{ runner.temp }}/bounded-memory-soak
          if-no-files-found: error
          retention-days: 90

  gate-b-evidence:
    name: Gate B bounded-resource evidence
    if: ${{ github.event_name == 'push' && needs.release-context.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - name: Run revision-locked Gate B evidence
        run: >-
          bash ci/run-gate-b-evidence.sh
          "$GITHUB_SHA"
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          "$RUNNER_TEMP/gate-b-evidence"
      - name: Retain Gate B bounded-resource evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gate-b-bounded-resource-evidence
          path: ${{ runner.temp }}/gate-b-evidence
          if-no-files-found: error
          retention-days: 90

  gate-c-evidence:
    name: Gate C endpoint evidence
    if: ${{ github.event_name == 'push' && needs.release-context.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
      - name: Run revision-locked Gate C evidence
        run: >-
          bash ci/run-gate-c-evidence.sh
          "$GITHUB_SHA"
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          "$RUNNER_TEMP/gate-c-evidence"
      - name: Retain Gate C endpoint evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gate-c-endpoint-evidence
          path: ${{ runner.temp }}/gate-c-evidence
          if-no-files-found: error
          retention-days: 90

  merge-ready:
    name: merge-ready
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - commit-messages
      - release-context
      - markdownlint
      - feature-matrix
      - fuzz-contract
      - fmt
      - public-docs
      - packaged-crate
      - security
      - public-api
      - msrv
      - feature-contract
      - public-interface
      - native-matrix
      - test
      - native-lifecycle
      - wasm
      - test-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require every applicable pre-merge check
        env:
          MERGE_READY_JOB_RESULTS: ${{ toJSON(needs) }}
          BUILD_CHECKS: ${{ needs.release-context.outputs.build-checks }}
          MARKDOWN_CHECKS: ${{ needs.release-context.outputs.markdown-checks }}
        run: bash ci/check-merge-ready.sh "$GITHUB_EVENT_NAME" "$BUILD_CHECKS" "$MARKDOWN_CHECKS"

  gate-a-evidence:
    name: Gate A release evidence
    if: ${{ always() && github.event_name == 'push' && needs.release-context.outputs.authorized == 'true' }}
    needs:
      - release-context
      - markdownlint
      - public-docs
      - packaged-crate
      - security
      - public-api
      - msrv
      - feature-contract
      - public-interface
      - native-matrix
      - test
      - native-lifecycle
      - wasm
      - test-coverage
      - performance-baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assemble revision-locked Gate A evidence
        env:
          GATE_A_JOB_RESULTS: ${{ toJSON(needs) }}
        run: >-
          bash ci/prepare-gate-a-evidence.sh
          "$GITHUB_SHA"
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          target/gate-a-evidence
      - name: Retain Gate A release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gate-a-release-evidence
          path: target/gate-a-evidence
          if-no-files-found: error
          retention-days: 90

  # The scheduled Gate D in `fuzz.yml` fans its sweep out the same way, for the
  # same reason: every target holds a fixed wall-clock budget, so sweeping them
  # in one process costs the sum of those budgets. The list lives in
  # `ci/run-fuzz.sh`, where `--check` already holds it against the manifest, the
  # seeds and the documented budgets.
  gate-d-fuzz-matrix:
    name: load candidate fuzz target matrix
    if: ${{ github.event_name == 'push' && needs.release-context.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    needs: release-context
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: matrix
        run: printf 'matrix=%s\n' "$(bash ci/run-fuzz.sh --matrix)" >>"$GITHUB_OUTPUT"

  gate-d-fuzz-target:
    name: candidate fuzz ${{ matrix.target }}
    if: ${{ github.event_name == 'push' && needs.release-context.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - release-context
      - gate-d-fuzz-matrix
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate-d-fuzz-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          cache: "false"
      - name: Install the fuzz runner
        run: cargo install cargo-fuzz --locked
      - name: Fuzz one target
        env:
          TARGET: ${{ matrix.target }}
        run: bash ci/run-fuzz.sh --target "$TARGET" "$RUNNER_TEMP/fuzz-result"
      - name: Retain the target result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gate-d-candidate-fuzz-${{ matrix.target }}
          path: ${{ runner.temp }}/fuzz-result
          if-no-files-found: error
          retention-days: 90

  # Scheduled Gate D keeps the ordinary branch under observation. A release
  # candidate needs evidence for its exact revision, so an authorized release
  # runs the same bounded verification once more in this workflow.
  gate-d-candidate-evidence:
    name: Gate D candidate evidence
    # A failing target still has to reach the evidence artifact, which is where
    # a maintainer reads why the release stopped, so this runs on anything short
    # of cancellation. The job itself then fails and the candidate is never
    # built.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.release-context.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - release-context
      - gate-d-fuzz-matrix
      - gate-d-fuzz-target
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The remaining components run on the toolchain `rust-toolchain.toml`
      # pins, which is what they always ran on: only the fuzz sweep needed
      # nightly, and it no longer runs in this job.
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Download the fuzz target results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ needs.gate-d-fuzz-matrix.outputs.matrix }}
        # A leg that never produced a result is a Gate D failure that belongs in
        # the evidence, so a missing artifact must not take this job down before
        # it can record one.
        run: |
          results="$RUNNER_TEMP/fuzz-results"
          mkdir -p "$results"
          for target in $(jq -r '.target[]' <<<"$MATRIX"); do
            gh run download "$GITHUB_RUN_ID" \
              --name "gate-d-candidate-fuzz-$target" --dir "$results/$target" \
              || echo "no result artifact for fuzz target $target" >&2
          done
      - name: Run revision-locked Gate D candidate verification
        env:
          GATE_D_FUZZ_RESULTS: ${{ runner.temp }}/fuzz-results
        run: >-
          bash ci/run-gate-d-evidence.sh
          "$GITHUB_SHA"
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          "$RUNNER_TEMP/gate-d-candidate-evidence"
      - name: Retain Gate D candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gate-d-candidate-evidence
          path: ${{ runner.temp }}/gate-d-candidate-evidence
          if-no-files-found: error
          retention-days: 90

  # Build and attest one candidate only after the four automated gate bundles
  # succeeded for this exact revision. Publishing remains a later, explicit
  # maintainer decision; this job has no package-registry or contents-write
  # permission.
  release-candidate:
    name: Verified release candidate
    if: ${{ github.event_name == 'push' && needs.release-context.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - release-context
      - gate-a-evidence
      - gate-b-evidence
      - gate-c-evidence
      - gate-d-candidate-evidence
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Download Gate A through D evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          evidence="$RUNNER_TEMP/candidate-evidence"
          gh run download "$GITHUB_RUN_ID" --name gate-a-release-evidence --dir "$evidence/gate-a"
          gh run download "$GITHUB_RUN_ID" --name gate-b-bounded-resource-evidence --dir "$evidence/gate-b"
          gh run download "$GITHUB_RUN_ID" --name gate-c-endpoint-evidence --dir "$evidence/gate-c"
          gh run download "$GITHUB_RUN_ID" --name gate-d-candidate-evidence --dir "$evidence/gate-d"
      - name: Prepare release artifacts from the validated revision
        id: artifacts
        run: bash ci/prepare-release-artifacts.sh "$GITHUB_SHA" "$RUNNER_TEMP/release-artifacts"
      - name: Generate crate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0
        with:
          file: ${{ steps.artifacts.outputs.crate }}
          format: spdx-json
          output-file: ${{ steps.artifacts.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false
      - name: Prepare the verified candidate
        run: >-
          bash ci/prepare-release-candidate.sh
          "$GITHUB_SHA"
          "${{ steps.artifacts.outputs.directory }}"
          "$RUNNER_TEMP/candidate-evidence"
      - name: Generate candidate provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ steps.artifacts.outputs.crate }}
            ${{ steps.artifacts.outputs.docs }}
            ${{ steps.artifacts.outputs.metadata }}
            ${{ steps.artifacts.outputs.sbom }}
            ${{ steps.artifacts.outputs.directory }}/CHANGELOG.md
            ${{ steps.artifacts.outputs.directory }}/lspf-CHANGELOG.md
            ${{ steps.artifacts.outputs.directory }}/candidate-metadata.json
            ${{ steps.artifacts.outputs.directory }}/candidate.md
            ${{ steps.artifacts.outputs.directory }}/evidence/**/*.json
            ${{ steps.artifacts.outputs.directory }}/evidence/**/*.md
      - name: Generate SBOM attestation
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.artifacts.outputs.crate }}
          sbom-path: ${{ steps.artifacts.outputs.sbom }}
      - name: Retain attestations and hash every candidate file
        env:
          ARTIFACT_DIRECTORY: ${{ steps.artifacts.outputs.directory }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_ATTESTATION_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "$ARTIFACT_DIRECTORY/provenance.jsonl"
          cp "$SBOM_ATTESTATION_BUNDLE" "$ARTIFACT_DIRECTORY/sbom-attestation.jsonl"
          cd "$ARTIFACT_DIRECTORY"
          find . -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS
      - name: Verify candidate hashes and clean installation
        run: >-
          bash ci/check-release-candidate.sh
          "$GITHUB_SHA"
          "${{ steps.artifacts.outputs.directory }}"
      - name: Retain verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lspf-${{ steps.artifacts.outputs.version }}-release-candidate
          path: ${{ steps.artifacts.outputs.directory }}
          if-no-files-found: error
          retention-days: 90

  # Gates A through D establish properties of a revision. Gate E establishes
  # them for the artifact: it grafts the candidate crate over `crates/lspf` in
  # a worktree reconstructed from this revision, so the compatibility,
  # overload, timeout, disconnect, child-cleanup, reference-server, and editor
  # journeys all compile the packaged bytes that will be published.
  #
  # One part of what it reports is not automated. The worksheet under
  # `editor-validation/` records what an operator saw driving the packaged
  # server through the editor journeys by hand, and its observations only
  # describe the release they were taken against. The file is checked in, so
  # this gate runs for any release either way; `ci/run-gate-e-evidence.sh`
  # reports it as a human judgment rather than proof, so leaving it stale
  # weakens the evidence instead of failing the gate. Refresh it while
  # preparing a release.
  gate-e-evidence:
    name: Gate E candidate validation evidence
    if: ${{ github.event_name == 'push' && needs.release-context.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - release-context
      - release-candidate
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Download the verified release candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_ARTIFACT: lspf-${{ needs.release-context.outputs.version }}-release-candidate
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --name "$CANDIDATE_ARTIFACT"
          --dir "$RUNNER_TEMP/candidate"
      - name: Validate the packaged candidate
        run: >-
          bash ci/run-gate-e-evidence.sh
          "$GITHUB_SHA"
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          "$RUNNER_TEMP/candidate"
          "$RUNNER_TEMP/gate-e-evidence"
      - name: Retain Gate E candidate validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gate-e-candidate-validation-evidence
          path: ${{ runner.temp }}/gate-e-evidence
          if-no-files-found: error
          retention-days: 90

  # Publishing is the only irreversible step in this pipeline, so it is the
  # only job behind a protected environment: a maintainer approves it after
  # reading the candidate report and the Gate E evidence. The job then proves
  # the crate the registry serves is byte-identical to the validated candidate
  # before it archives the release record.
  release-publish:
    name: Publish the verified candidate
    if: ${{ github.event_name == 'push' && needs.release-context.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - release-context
      - release-candidate
      - gate-e-evidence
    environment: crates-io
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Download the verified candidate and its Gate E evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_ARTIFACT: lspf-${{ needs.release-context.outputs.version }}-release-candidate
        run: |
          gh run download "$GITHUB_RUN_ID" --name "$CANDIDATE_ARTIFACT" \
            --dir "$RUNNER_TEMP/candidate"
          gh run download "$GITHUB_RUN_ID" \
            --name gate-e-candidate-validation-evidence \
            --dir "$RUNNER_TEMP/gate-e-evidence"
      # `cargo publish` packages from source rather than uploading the verified
      # artifact, so prove the package this revision produces is still the
      # candidate before anything irreversible happens.
      - name: Prove this revision repackages to the validated candidate
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: >-
          bash ci/check-repackaged-candidate.sh
          "$GITHUB_SHA"
          "$RUNNER_TEMP/candidate/lspf-$RELEASE_VERSION.crate"
      # Trusted publishing mints a short-lived registry token from this run's
      # OIDC identity, so no long-lived crates.io token exists to leak.
      - name: Mint a short-lived crates.io token
        id: registry
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the validated revision
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.registry.outputs.token }}
        run: cargo publish -p lspf --locked
      - name: Download the crate the registry now serves
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: >-
          curl --fail --silent --show-error --location
          --retry 10 --retry-delay 15 --retry-all-errors
          --output "$RUNNER_TEMP/published.crate"
          "https://static.crates.io/crates/lspf/lspf-$RELEASE_VERSION.crate"
      - name: Archive the release record
        run: >-
          bash ci/prepare-release-record.sh
          "$GITHUB_SHA"
          "$RUNNER_TEMP/candidate"
          "$RUNNER_TEMP/gate-e-evidence"
          "$RUNNER_TEMP/published.crate"
          "$RUNNER_TEMP/release-record"
      - name: Verify the archived release record
        run: >-
          bash ci/check-release-record.sh
          "$GITHUB_SHA"
          "$RUNNER_TEMP/release-record"
      - name: Retain the release record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lspf-${{ needs.release-context.outputs.version }}-release-record
          path: ${{ runner.temp }}/release-record
          if-no-files-found: error
          retention-days: 90
      - name: Tag the release and attach the record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.release-context.outputs.version }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          record="$RUNNER_TEMP/release-record"
          # The release body links this asset by name, so take the name from the
          # record that wrote the link instead of spelling it out a second time.
          archive="$RUNNER_TEMP/$(jq -r '.recordArchive' "$record/release-record.json")"
          tar -czf "$archive" -C "$record" .
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "lspf $RELEASE_VERSION" \
            --notes-file "$record/release-record.md" \
            "$archive"

  # A normal main push only needs enough policy validation to protect the
  # write-capable release-plz PR job. Full dependency, platform, and release
  # gates already ran before merge and run again only for an authorized release.
  release-plz-policy:
    name: release-plz workflow policy
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the workflow policy YAML parser
        uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b # v1.3.1
        with:
          version: v4.53.6
          force: true
      - name: Enforce Action pins and minimal job permissions
        run: bash ci/check-workflow-security.sh

  # Open/update a release PR with version bumps and changelog.
  release-plz-pr:
    name: Release-plz PR
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: release-plz-policy
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Cached, unlike the other release job: this runs on every push to `main`.
      - name: Install Rust toolchain and cargo-semver-checks
        uses: ./.github/actions/setup-rust
        with:
          tools: cargo-semver-checks@0.50.0
      # release-plz's `semver_check` defaults to on but shells out to
      # `cargo-semver-checks`, so without this install it silently does nothing
      # and every breaking change is proposed as a minor bump. Keep the version
      # pinned to the one the `public-api` job uses, so the bump release-plz
      # picks and the compatibility gate agree on what counts as breaking.
      # A branch pushed with the default `GITHUB_TOKEN` starts no workflow run,
      # by design, so release pull requests arrive with CI never having run on
      # them. Mint an App token instead, whose pushes are ordinary events.
      #
      # The App's client id is a repository variable rather than a secret
      # because it is not sensitive, and because `vars` can gate this step while
      # `secrets` cannot. Until that variable is set the step is skipped and
      # release-plz falls back to `GITHUB_TOKEN`, so this is safe to merge
      # before the App exists; it only means release pull requests keep arriving
      # unchecked. `app-id` accepts the numeric App ID and is deprecated in
      # favour of `client-id`, which is a different value: swapping the input
      # without also repointing the variable would break token minting.
      - name: Generate a token whose pushes trigger workflows
        id: app-token
        if: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Run release-plz
        uses: release-plz/action@b5543c19b03be9bd48852d20ca89f478b7723260 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
