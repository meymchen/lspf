name: CI

# The `paths-ignore` lists below are duplicated on purpose: the Actions workflow
# parser does not support YAML anchors, so a shared alias would parse locally
# under yq and then fail on GitHub. Keep the two lists identical.
#
# These paths cannot change what the workspace builds, tests, documents, or
# packages. `SECURITY.md` is deliberately absent: Gate A cites it as the
# implementation of the support-matrix and compatibility-policy claims.
# `README.md` and `docs/guides/**` are absent too, because they are compiled
# into rustdoc through `#[doc = include_str!]` and their examples are doctested.
on:
  push:
    branches: [main]
    paths-ignore:
      - docs/adr/**
      - docs/agents/**
      - .vscode/**
      - .zed/**
      - CONTEXT.md
      - AGENTS.md
      - CLAUDE.md
  pull_request:
    paths-ignore:
      - docs/adr/**
      - docs/agents/**
      - .vscode/**
      - .zed/**
      - CONTEXT.md
      - AGENTS.md
      - CLAUDE.md

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  feature-matrix:
    name: load native feature matrix
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: matrix
        run: echo "value=$(jq -c . ci/native-feature-matrix.json)" >> "$GITHUB_OUTPUT"

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: "**/*.md"

  fuzz-contract:
    name: fuzz contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash ci/test-run-fuzz.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - run: cargo fmt --all -- --check

  public-docs:
    name: public docs
    uses: ./.github/workflows/public-docs.yml
    permissions:
      contents: read

  packaged-crate:
    name: packaged crate
    uses: ./.github/workflows/packaged-crate.yml
    permissions:
      contents: read

  security:
    name: supply-chain security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  public-api:
    name: public API compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install cargo-semver-checks --version 0.50.0 --locked
      - name: Test compatibility gate behavior
        run: bash ci/test-check-public-api.sh
      - name: Compare supported public API surfaces
        run: bash ci/check-public-api.sh
      - name: Upload machine-readable compatibility report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-api-compatibility-report
          path: target/public-api-compatibility/report.json
          if-no-files-found: error
          retention-days: 14

  msrv:
    name: msrv
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: feature-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.feature-matrix.outputs.matrix) }}
    # Keep the explicit override aligned with `rust-toolchain.toml` and the
    # workspace `rust-version`, so the MSRV matrix cannot drift independently.
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.0
      - run: cargo check -p lspf --locked ${{ matrix.cargo_args }}
        env:
          RUSTFLAGS: ${{ matrix.msrv_rustflags }}
      - if: matrix.name == 'default'
        run: cargo check --workspace --all-targets --locked

  feature-contract:
    name: feature contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - run: bash ci/check-feature-contract.sh

  native-matrix:
    name: native ${{ matrix.name }}
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: feature-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.feature-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - name: Clippy with warnings denied
        run: cargo clippy -p lspf --all-targets --locked ${{ matrix.cargo_args }} -- -D warnings
      - name: All-target tests
        run: cargo test -p lspf --all-targets --locked ${{ matrix.cargo_args }}

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
      - run: bash ci/test-check-editor-validation.sh
      - run: cargo test --workspace --features stdio,tcp,websocket,proposed,testing --all-targets
      - run: cargo test --workspace --features stdio,tcp,websocket,proposed,testing --doc

  native-lifecycle:
    name: native lifecycle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS (Intel)
            os: macos-15-intel
          - name: macOS (Apple Silicon)
            os: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
      - name: Initialize, typed request, shutdown, and exit
        run: cargo test -p lspf-hello --test e2e -- --nocapture

  wasm:
    name: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      # The pre-0.5 compile spike (ADR 0020): the protocol kernel must compile
      # for wasm32 without enabling the Tokio runtime.
      - run: cargo check -p lspf --target wasm32-unknown-unknown --no-default-features --features wasm --locked
      - run: cargo check -p lspf --target wasm32-unknown-unknown --no-default-features --features wasm --example shared_server --locked
      - run: cargo check -p lspf --target wasm32-unknown-unknown --no-default-features --features worker-channel --locked
      - run: cargo check -p lspf --target wasm32-unknown-unknown --no-default-features --features worker-channel --example worker_channel --locked
      - run: bash ci/check-worker-channel-examples.sh
      - run: cargo clippy -p lspf --target wasm32-unknown-unknown --no-default-features --features worker-channel --all-targets --locked -- -D warnings
      - run: cargo test -p lspf --target wasm32-unknown-unknown --no-default-features --features worker-channel --all-targets --locked
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  test-coverage:
    name: test coverage
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview
      - run: cargo install cargo-llvm-cov --version 0.6.21 --locked
      - name: Test the test-coverage gate behavior
        run: bash ci/test-check-test-coverage.sh
      - name: Exercise the whole workspace
        run: cargo llvm-cov --workspace --features stdio,tcp,websocket,proposed,testing --all-targets --no-report
      - name: Generate human- and machine-readable reports
        run: |
          cargo llvm-cov report --html --output-dir target/test-coverage
          cargo llvm-cov report --lcov --output-path target/test-coverage/lcov.info
          cargo llvm-cov report --json --summary-only --output-path target/test-coverage/raw-summary.json
      - name: Execute declared failure-path evidence tests
        run: bash ci/run-coverage-evidence-tests.sh
      - name: Enforce workspace and protocol-engine baselines
        run: bash ci/check-test-coverage.sh
      - name: Upload test-coverage reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-coverage-report
          path: |
            target/test-coverage/html
            target/test-coverage/lcov.info
            target/test-coverage/raw-summary.json
            target/test-coverage/evidence.json
            target/test-coverage/summary.json
          if-no-files-found: error
          retention-days: 14

  performance-baseline:
    name: Reproducible performance baseline
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
      - name: Test performance benchmark contract
        run: bash ci/test-performance-benchmark.sh
      - name: Test performance regression gate behavior
        run: bash ci/test-run-performance-baseline.sh
      - name: Run revision-locked performance baseline
        run: >-
          bash ci/run-performance-baseline.sh
          "$GITHUB_SHA"
          "$RUNNER_TEMP/performance-baseline"
      - name: Retain performance baseline
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reproducible-performance-baseline
          path: ${{ runner.temp }}/performance-baseline
          if-no-files-found: error
          retention-days: 90

  bounded-memory-soak:
    name: Bounded-memory soak journeys (${{ matrix.scenario }})
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - request
          - cancellation
          - edit
          - progress
          - slow-peer
          - reconnect
          - shutdown
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
      - name: Test soak runner contract
        run: bash ci/test-run-soak-journeys.sh
      - name: Test soak workload contract
        run: bash ci/test-soak-journeys.sh
      - name: Select soak scenario
        env:
          SOAK_SCENARIO: ${{ matrix.scenario }}
        run: >-
          jq --arg scenario "$SOAK_SCENARIO"
          '.scenarios = [$scenario]'
          soak/workloads-v1.json
          > "$RUNNER_TEMP/soak-workload.json"
      - name: Run revision-locked soak journeys
        env:
          SOAK_WORKLOADS: ${{ runner.temp }}/soak-workload.json
        run: >-
          bash ci/run-soak-journeys.sh
          "$GITHUB_SHA"
          "$RUNNER_TEMP/bounded-memory-soak"
      - name: Retain bounded-memory soak artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bounded-memory-soak-${{ matrix.scenario }}
          path: ${{ runner.temp }}/bounded-memory-soak
          if-no-files-found: error
          retention-days: 90

  gate-b-evidence:
    name: Gate B bounded-resource evidence
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
      - name: Run revision-locked Gate B evidence
        run: >-
          bash ci/run-gate-b-evidence.sh
          "$GITHUB_SHA"
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          "$RUNNER_TEMP/gate-b-evidence"
      - name: Retain Gate B bounded-resource evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gate-b-bounded-resource-evidence
          path: ${{ runner.temp }}/gate-b-evidence
          if-no-files-found: error
          retention-days: 90

  gate-c-evidence:
    name: Gate C endpoint evidence
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-rust
      - name: Run revision-locked Gate C evidence
        run: >-
          bash ci/run-gate-c-evidence.sh
          "$GITHUB_SHA"
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          "$RUNNER_TEMP/gate-c-evidence"
      - name: Retain Gate C endpoint evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gate-c-endpoint-evidence
          path: ${{ runner.temp }}/gate-c-evidence
          if-no-files-found: error
          retention-days: 90

  gate-a-evidence:
    name: Gate A release evidence
    if: ${{ always() && github.event_name == 'push' }}
    needs:
      - markdownlint
      - public-docs
      - packaged-crate
      - security
      - public-api
      - msrv
      - feature-contract
      - native-matrix
      - test
      - native-lifecycle
      - wasm
      - test-coverage
      - performance-baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Assemble revision-locked Gate A evidence
        env:
          GATE_A_JOB_RESULTS: ${{ toJSON(needs) }}
        run: >-
          bash ci/prepare-gate-a-evidence.sh
          "$GITHUB_SHA"
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          target/gate-a-evidence
      - name: Retain Gate A release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gate-a-release-evidence
          path: target/gate-a-evidence
          if-no-files-found: error
          retention-days: 90

  # Publish unreleased packages and create git tags / GitHub releases. The
  # release gates live here rather than in a separate workflow so that one push
  # runs them once: `needs` reuses the very jobs CI already ran for this
  # revision, which keeps "not published without passing its gates" structural.
  release-plz-release:
    name: Release-plz release
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: [public-docs, packaged-crate, security]
    permissions:
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Prepare release artifacts from the validated revision
        id: artifacts
        run: bash ci/prepare-release-artifacts.sh "$GITHUB_SHA" "$RUNNER_TEMP/release-artifacts"
      - name: Generate crate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ steps.artifacts.outputs.crate }}
          format: spdx-json
          output-file: ${{ steps.artifacts.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false
      - name: Generate build provenance statement
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ steps.artifacts.outputs.crate }}
            ${{ steps.artifacts.outputs.metadata }}
            ${{ steps.artifacts.outputs.sbom }}
            ${{ steps.artifacts.outputs.directory }}/CHANGELOG.md
            ${{ steps.artifacts.outputs.directory }}/lspf-CHANGELOG.md
      - name: Generate SBOM attestation
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.artifacts.outputs.crate }}
          sbom-path: ${{ steps.artifacts.outputs.sbom }}
      - name: Retain attestation statements and artifact hashes
        env:
          ARTIFACT_DIRECTORY: ${{ steps.artifacts.outputs.directory }}
          CRATE_PATH: ${{ steps.artifacts.outputs.crate }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_PATH: ${{ steps.artifacts.outputs.sbom }}
          SBOM_ATTESTATION_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "$ARTIFACT_DIRECTORY/provenance.jsonl"
          cp "$SBOM_ATTESTATION_BUNDLE" "$ARTIFACT_DIRECTORY/sbom-attestation.jsonl"
          crate_file=$(basename "$CRATE_PATH")
          sbom_file=$(basename "$SBOM_PATH")
          cd "$ARTIFACT_DIRECTORY"
          sha256sum \
            "$crate_file" \
            CHANGELOG.md \
            lspf-CHANGELOG.md \
            release-metadata.json \
            "$sbom_file" \
            provenance.jsonl \
            sbom-attestation.jsonl \
            > SHA256SUMS
      - name: Retain traceable release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lspf-${{ steps.artifacts.outputs.version }}-release-artifacts
          path: ${{ steps.artifacts.outputs.directory }}
          if-no-files-found: error
          retention-days: 90
      - name: Run release-plz
        id: release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Attach artifacts to the GitHub release
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "${{ steps.artifacts.outputs.tag }}" \
            "${{ steps.artifacts.outputs.directory }}"/* \
            --clobber

  # Open/update a release PR with version bumps and changelog.
  release-plz-pr:
    name: Release-plz PR
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
