name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  public-docs:
    name: Public docs release gate
    uses: ./.github/workflows/public-docs.yml
    permissions:
      contents: read

  packaged-crate:
    name: Packaged crate release gate
    uses: ./.github/workflows/packaged-crate.yml
    permissions:
      contents: read

  # Publish unreleased packages and create git tags / GitHub releases.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    needs: [public-docs, packaged-crate]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open/update a release PR with version bumps and changelog.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
