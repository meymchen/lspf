name: Release-plz

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  public-docs:
    name: Public docs release gate
    uses: ./.github/workflows/public-docs.yml
    permissions:
      contents: read

  packaged-crate:
    name: Packaged crate release gate
    uses: ./.github/workflows/packaged-crate.yml
    permissions:
      contents: read

  security:
    name: Supply-chain security release gate
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  # Publish unreleased packages and create git tags / GitHub releases.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    needs: [public-docs, packaged-crate, security]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open/update a release PR with version bumps and changelog.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
