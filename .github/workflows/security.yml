name: Security

on:
  workflow_call:

permissions: {}

jobs:
  supply-chain:
    name: dependencies and workflow policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit dependency advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses
      # Without this the npm steps below run on whatever npm the runner image
      # happens to ship, which is how a registry-side rejection of
      # `--package-lock-only` arrived without any dependency changing.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: tools/vscode-test-client/.nvmrc
      - name: Audit npm dependency advisories
        run: npm audit --package-lock-only --audit-level=low --prefix tools/vscode-test-client
      - name: Test npm license policy diagnostics
        run: bash ci/test-check-npm-licenses.sh
      - name: Audit npm dependency licenses
        run: bash ci/check-npm-licenses.sh
      - name: Install the workflow policy YAML parser
        uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b # v1.3.1
        with:
          version: v4.53.6
          force: true
      - name: Test workflow policy diagnostics
        run: bash ci/test-check-workflow-security.sh
      - name: Test release artifact workflow contract
        run: bash ci/test-release-artifacts-workflow.sh
      - name: Test release candidate preparation
        run: bash ci/test-prepare-release-candidate.sh
      - name: Test release candidate verification
        run: bash ci/test-check-release-candidate.sh
      - name: Test release blocker register diagnostics
        run: bash ci/test-check-release-blockers.sh
      - name: Test Gate E candidate validation
        run: bash ci/test-run-gate-e-evidence.sh
      - name: Test the pre-publication repackaging comparison
        run: bash ci/test-check-repackaged-candidate.sh
      - name: Test release record preparation and verification
        run: bash ci/test-prepare-release-record.sh
      - name: Test SonarCloud workflow contract
        run: bash ci/test-sonarcloud-workflow.sh
      - name: Test CodeQL workflow contract
        run: bash ci/test-codeql-workflow.sh
      - name: Test Gate A evidence workflow contract
        run: bash ci/test-gate-a-evidence-workflow.sh
      - name: Test Gate B evidence workflow contract
        run: bash ci/test-gate-b-evidence-workflow.sh
      - name: Test Gate C evidence workflow contract
        run: bash ci/test-gate-c-evidence-workflow.sh
      - name: Test Gate D evidence workflow contract
        run: bash ci/test-gate-d-evidence-workflow.sh
      - name: Test Gate D evidence assembly
        run: bash ci/test-run-gate-d-evidence.sh
      - name: Test Gate E evidence workflow contract
        run: bash ci/test-gate-e-evidence-workflow.sh
      - name: Test release publication workflow contract
        run: bash ci/test-release-publication-workflow.sh
      - name: Test performance baseline workflow contract
        run: bash ci/test-performance-baseline-workflow.sh
      - name: Test soak journey workflow contract
        run: bash ci/test-soak-journey-workflow.sh
      - name: Test CI pull-request fast-path contract
        run: bash ci/test-ci-fast-path.sh
      - name: Test CI change classification
        run: bash ci/test-classify-ci-changes.sh
      - name: Test release context detection
        run: bash ci/test-detect-release-context.sh
      - name: Test merge readiness aggregation
        run: bash ci/test-check-merge-ready.sh
      - name: Enforce Action pins and minimal job permissions
        run: bash ci/check-workflow-security.sh
