name: Security

on:
  workflow_call:

permissions: {}

jobs:
  supply-chain:
    name: dependencies and workflow policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit dependency advisories and licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses
      # npm advisories are covered by Dependabot alerts, which read the same
      # lockfile through the dependency graph. Auditing them here as well only
      # added a hard dependency on the npm advisory endpoint, whose outages
      # failed this job without any dependency changing.
      #
      # The npm license checks below parse the lockfile with jq and never reach
      # the network, so they need neither Node nor npm.
      - name: Test npm license policy diagnostics
        run: bash ci/tests/unit/check-npm-licenses.sh
      - name: Audit npm dependency licenses
        run: bash ci/check-npm-licenses.sh
      - name: Install the workflow policy YAML parser
        uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b # v1.3.1
        with:
          version: v4.53.6
          force: true
      - name: Test workflow policy diagnostics
        run: bash ci/tests/unit/check-workflow-security.sh
      - name: Test release artifact workflow contract
        run: bash ci/tests/workflow/release-artifacts.sh
      - name: Test release candidate preparation
        run: bash ci/tests/unit/prepare-release-candidate.sh
      - name: Test release candidate verification
        run: bash ci/tests/unit/check-release-candidate.sh
      - name: Test release blocker register diagnostics
        run: bash ci/tests/unit/check-release-blockers.sh
      - name: Test Gate E candidate validation
        run: bash ci/tests/unit/run-gate-e-evidence.sh
      - name: Test the pre-publication repackaging comparison
        run: bash ci/tests/unit/check-repackaged-candidate.sh
      - name: Test release record preparation and verification
        run: bash ci/tests/unit/prepare-release-record.sh
      - name: Test SonarCloud workflow contract
        run: bash ci/tests/workflow/sonarcloud.sh
      - name: Test CodeQL workflow contract
        run: bash ci/tests/workflow/codeql.sh
      - name: Test Gate A evidence workflow contract
        run: bash ci/tests/workflow/gate-a-evidence.sh
      - name: Test Gate B evidence workflow contract
        run: bash ci/tests/workflow/gate-b-evidence.sh
      - name: Test Gate C evidence workflow contract
        run: bash ci/tests/workflow/gate-c-evidence.sh
      - name: Test Gate D evidence workflow contract
        run: bash ci/tests/workflow/gate-d-evidence.sh
      - name: Test Gate D evidence assembly
        run: bash ci/tests/unit/run-gate-d-evidence.sh
      - name: Test Gate E evidence workflow contract
        run: bash ci/tests/workflow/gate-e-evidence.sh
      - name: Test release publication workflow contract
        run: bash ci/tests/workflow/release-publication.sh
      - name: Test performance baseline workflow contract
        run: bash ci/tests/workflow/performance-baseline.sh
      - name: Test soak journey workflow contract
        run: bash ci/tests/workflow/soak-journey.sh
      - name: Test CI pull-request fast-path contract
        run: bash ci/tests/workflow/ci-fast-path.sh
      - name: Test CI change classification
        run: bash ci/tests/unit/classify-ci-changes.sh
      - name: Test release context detection
        run: bash ci/tests/unit/detect-release-context.sh
      - name: Test merge readiness aggregation
        run: bash ci/tests/unit/check-merge-ready.sh
      - name: Enforce Action pins and minimal job permissions
        run: bash ci/check-workflow-security.sh
