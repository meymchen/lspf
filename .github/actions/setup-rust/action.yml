name: Set up Rust
description: Install the requested Rust toolchain and CLI tools, and optionally restore the Cargo cache.

inputs:
  toolchain:
    description: Rust toolchain name or version.
    default: 1.98.0
  components:
    description: Comma-separated Rust components to install.
    default: ""
  targets:
    description: Comma-separated Rust targets to install.
    default: ""
  tools:
    description: Comma- or whitespace-separated Rust CLI tools and versions to install.
    default: ""
  cache:
    description: Whether to restore and save the Cargo cache.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - name: Restore Cargo cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
    - name: Install Rust CLI tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
      with:
        tool: ${{ inputs.tools }}
        fallback: none
