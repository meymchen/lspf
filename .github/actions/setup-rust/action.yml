name: Set up Rust
description: Install the requested Rust toolchain and optionally restore the Cargo cache.

inputs:
  toolchain:
    description: Rust toolchain name or version.
    default: stable
  components:
    description: Comma-separated Rust components to install.
    default: ""
  targets:
    description: Comma-separated Rust targets to install.
    default: ""
  cache:
    description: Whether to restore and save the Cargo cache.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - name: Restore Cargo cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
