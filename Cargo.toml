[workspace]
members = ["crates/lspf", "crates/lspf-hello", "crates/lspf-markdown"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Yuming Chen"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/meymchen/lspf"

[workspace.dependencies]
# Workspace consumers opt into exactly the stdio transport instead of
# inheriting the crate's defaults, so no-default feature checks stay honest.
lspf = { path = "crates/lspf", version = "1.0.0", default-features = false, features = ["stdio"] }
bytes = "1"
# The kernel's target-agnostic mpsc and oneshot channels (ADR 0020); they
# compile on wasm32 without a Tokio runtime.
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false }
gen-lsp-types = { version = "=0.11.0", features = ["fluent-uri"] }
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "io-util", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "stream"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tempfile = "3"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"
