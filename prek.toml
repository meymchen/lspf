default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt --check",
    language = "system",
    entry = "cargo fmt --all -- --check",
    pass_filenames = false,
    files = '(^|/)(Cargo\.(toml|lock)|rust-toolchain(\.toml)?|.*\.rs)$',
    stages = ["pre-commit"],
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    language = "system",
    entry = "bash ci/native-feature-command.sh clippy",
    pass_filenames = false,
    files = '(^|/)(Cargo\.(toml|lock)|rust-toolchain(\.toml)?|.*\.rs)$',
    stages = ["pre-commit"],
  },
  {
    id = "commit-message",
    name = "commit message policy",
    language = "system",
    entry = "node ci/check-commit-messages.mjs --message-file",
    pass_filenames = true,
    stages = ["commit-msg"],
  },
]
