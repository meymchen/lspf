[package]
name = "lspf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A Rust framework for building extensible LSP language servers"
readme = "../../README.md"

[dependencies]
bytes.workspace = true
# The kernel's target-agnostic mpsc and oneshot channels (ADR 0020).
futures-channel.workspace = true
# `std` supplies `FutureExt::catch_unwind`, and `async-await-macro` supplies
# the kernel's `select!`; both compile on wasm32.
futures-util = { workspace = true, features = ["std", "async-await-macro"] }
lsp-types.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The Tokio runtime behind every native Transport (ADR 0013): optional, pulled
# in only through the `runtime-tokio` feature.
tokio = { workspace = true, optional = true }
# The WebSocket adapter's framing library (ADR 0011): optional, pulled in only
# through the `websocket` feature.
tokio-tungstenite = { workspace = true, optional = true }
# Only the runtime-neutral `CancellationToken` primitive of ADR 0007 is used;
# `default-features = false` keeps tokio's runtime out of the wasm build, and
# `codec` (the stdio/TCP framing decoder) is enabled per feature below.
tokio-util = { workspace = true, default-features = false }
tracing.workspace = true
# The browser WASM task spawner behind the `wasm` feature (ADR 0020): optional
# so the native default tree never carries WASM-only dependencies.
wasm-bindgen-futures = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "io-std", "fs"] }

[features]
# Native stdio is the default experience: opting in also selects the Tokio
# runtime that serves it (the 0.5 feature graph, ADR 0013).
default = ["stdio"]
stdio = ["runtime-tokio", "tokio-util/codec"]
tcp = ["runtime-tokio", "tokio-util/codec"]
websocket = ["runtime-tokio", "dep:tokio-tungstenite"]
runtime-tokio = ["dep:tokio"]
wasm = ["dep:wasm-bindgen-futures"]
# The browser MessagePort transport rides on the WASM runtime.
worker-channel = ["wasm"]
# Proposed (not yet stabilized) LSP protocol surface. Off by default so the
# stable API stays exactly the 3.17 catalog; enabling it only adds the
# `proposed` module and the gated `Client` helpers. It pulls in no Transport.
proposed = []

# Dev-dependencies drive the native test suite and the native half of the
# shared example; a wasm32 build (including `--example`) resolves none of
# them, so tokio's native-only features never reach the wasm32 target.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
tracing-subscriber.workspace = true
