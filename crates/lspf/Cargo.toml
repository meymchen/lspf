# Dev-dependencies drive the native test suite and the native half of the
# shared example; a wasm32 build (including `--example`) resolves none of
# them, so tokio's native-only features never reach the wasm32 target.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "net", "test-util"] }
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
web-sys = { workspace = true, features = ["MessageChannel"] }
