[package]
name = "lspf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A Rust framework for building extensible LSP language servers"
readme = "../../README.md"
include = [
    "src/**",
    "examples/**",
    "!examples/**/pkg/**",
    "tests/**",
    "benches/**",
    "build.rs",
    "CHANGELOG.md",
]

[dependencies]
bytes.workspace = true
# The kernel's target-agnostic mpsc and oneshot channels (ADR 0020).
futures-channel.workspace = true
# `std` supplies `FutureExt::catch_unwind`, and `async-await-macro` supplies
# the kernel's `select!`; both compile on wasm32.
futures-util = { workspace = true, features = ["std", "async-await-macro"] }
lsp-types.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Only the runtime-neutral `CancellationToken` primitive of ADR 0007 is used;
# `default-features = false` keeps tokio's runtime out of the wasm build, and
# `codec` (the stdio/TCP framing decoder) is enabled per feature below.
tokio-util = { workspace = true, default-features = false }
tracing.workspace = true
# JavaScript interop behind the browser/Node Worker MessagePort adapter. All
# three are optional so native builds keep no Worker bindings in their
# dependency tree.
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Event",
    "MessageEvent",
    "MessagePort",
] }
# The Worker-hosted WASM task spawner behind the `wasm` feature (ADR 0020):
# optional so the native default tree never carries WASM-only dependencies.
wasm-bindgen-futures = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Deadline sleeps are implemented by JavaScript timers only on a real WASM
# target. Keeping this target-specific also lets the public-API gate inspect
# WASM cfg branches with host rustdoc without compiling WASM-only internals.
gloo-timers = { version = "0.3", optional = true, features = ["futures"] }
# `std::time::Instant::now()` panics on `wasm32-unknown-unknown`; web-time is
# API-compatible and uses the Worker-global Performance clock instead.
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The Tokio runtime behind every native Transport (ADR 0013): optional, pulled
# in only through the `runtime-tokio` feature. Keeping it native-only lets lspf
# emit its own diagnostic before socket dependencies reject wasm32.
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "io-std", "fs", "time"] }
# The WebSocket adapter's framing library (ADR 0011): optional, pulled in only
# through the `websocket` feature and never resolved for Worker-hosted WASM.
tokio-tungstenite = { workspace = true, optional = true }

[features]
# Native stdio is the default experience: opting in also selects the Tokio
# runtime that serves it (the 0.5 feature graph, ADR 0013).
default = ["stdio"]
stdio = ["runtime-tokio", "tokio-util/codec", "tokio/io-util", "tokio/process"]
tcp = ["runtime-tokio", "tokio-util/codec", "tokio/net"]
websocket = ["runtime-tokio", "dep:tokio-tungstenite", "tokio/net"]
runtime-tokio = ["dep:tokio"]
wasm = ["dep:gloo-timers", "dep:wasm-bindgen-futures"]
# The browser/Node Worker MessagePort transport rides on the WASM runtime.
worker-channel = ["wasm", "dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]
# Proposed (not yet stabilized) LSP protocol surface. Off by default so the
# stable API stays exactly the 3.17 catalog; enabling it only adds the
# `proposed` module and the gated `ClientHandle` helpers. It pulls in no Transport.
proposed = []
# Native downstream test harness: an in-memory Transport, protocol journeys,
# and Tokio's deterministic virtual clock.
testing = ["runtime-tokio", "tokio/test-util"]
# Internal harness surface used only by the repository's cargo-fuzz package.
# Framing needs tokio-util's codec traits; lifecycle fuzzing exercises the
# native Client state machine compiled by runtime-tokio.
fuzzing = ["runtime-tokio", "tokio-util/codec"]

# Transport examples name feature-gated APIs directly. `required-features`
# keeps each example out of unrelated feature rows while CI builds it in the
# row that provides its adapter.

[[example]]
name = "native_tcp"
required-features = ["tcp"]

[[example]]
name = "native_websocket"
required-features = ["websocket"]

[[example]]
name = "worker_channel"
required-features = ["worker-channel"]

